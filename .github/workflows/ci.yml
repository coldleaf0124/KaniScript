name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run Test Suite (44 Tests)
      run: |
        python3 tests/test_all.py

    - name: Run Memory Safety & Escape Tests
      run: |
        kani run tests/test_escape_safety.ks
        kani run tests/test_fn_in_loop_leak.ks
        kani run tests/test_recursive_string.ks
        kani run tests/test_nested_struct.ks

    - name: Run Numbered Examples
      run: |
        kani run examples/01_hello.ks
        kani run examples/02_fibonacci.ks
        kani run examples/03_escape_safety.ks
