<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <mask id="eye-mask">
      <!-- 白で描画部分を保持 -->
      <rect width="100" height="100" fill="white" />
      <!-- 黒で目穴を透過切り抜き -->
      <circle cx="68" cy="28" r="4.5" fill="black" />
      <circle cx="68" cy="72" r="4.5" fill="black" />
    </mask>
  </defs>
  
  <g mask="url(#eye-mask)">
    <!-- 縦幹バー (甲羅/幹) -->
    <rect x="24" y="18" width="14" height="64" rx="7" fill="#FF5722" />
    
    <!-- 上ハサミ (右斜め上へ開く K の右上) -->
    <path d="M 38 48 C 45 48, 55 42, 65 30 C 72 22, 78 24, 76 32 C 72 44, 58 54, 48 56 Z" fill="#FF7043" />
    
    <!-- 下ハサミ (右斜め下へ開く K の右下) -->
    <path d="M 38 52 C 45 52, 55 58, 65 70 C 72 78, 78 76, 76 68 C 72 56, 58 46, 48 44 Z" fill="#FF8A65" />
  </g>
</svg>
