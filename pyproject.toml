[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kaniscript"
version = "0.1.0"
description = "KaniScript (kani / ks) — Fast, Safe, Simple programming language"
readme = "README.md"
authors = [{ name = "KaniScript Team" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords = ["compiler", "programming-language", "c++", "systems-programming"]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/coldleaf0124/kaniscript"
Repository = "https://github.com/coldleaf0124/kaniscript"

[project.scripts]
kani = "src.compiler:main"
ks = "src.compiler:main"
kaniscript = "src.compiler:main"
hc = "src.compiler:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "stdlib*"]

[tool.setuptools.package-data]
stdlib = ["*.h"]
